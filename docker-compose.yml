version: "3.8"

# ============================================================
# CENTRO DE COMANDO — Docker Compose
# Para desenvolvimento local: docker-compose up -d
# Para Railway: use o Dockerfile de cada serviço separado
# ============================================================

services:

  # ── n8n: Orquestrador de automações ─────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: centro_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-admin123}
      - DB_TYPE=sqlite
      - DB_SQLITE_DATABASE=/home/node/.n8n/database.sqlite
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_LOG_LEVEL=info
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_HIRING_BANNER_ENABLED=false
      # Variáveis disponíveis nos workflows
      - BACKEND_URL=http://backend:5000
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - rede_centro
    depends_on:
      - backend

  # ── Python Backend: Cérebro com IA ──────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: centro_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AIRTABLE_API_KEY=${AIRTABLE_API_KEY}
      - AIRTABLE_BASE_ID=${AIRTABLE_BASE_ID}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_WHATSAPP_FROM=${TWILIO_WHATSAPP_FROM:-}
      - ZAPI_INSTANCE_ID=${ZAPI_INSTANCE_ID:-}
      - ZAPI_TOKEN=${ZAPI_TOKEN:-}
      - WHATSAPP_ADULTO_1=${WHATSAPP_ADULTO_1:-}
      - WHATSAPP_ADULTO_2=${WHATSAPP_ADULTO_2:-}
      - FLASK_ENV=production
      - PORT=5000
    networks:
      - rede_centro

volumes:
  n8n_data:
    driver: local

networks:
  rede_centro:
    driver: bridge
